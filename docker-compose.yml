name: ride-lakehouse

x-aws-env: &aws-env
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

x-spark-job: &spark-job
  build: ./streaming
  image: ride-lakehouse/streaming
  restart: unless-stopped
  environment:
    <<: *aws-env
    KAFKA_BOOTSTRAP: kafka:29092
    S3_ENDPOINT: http://minio:9000
    LAKE_BUCKET: lake
    METRICS_PATH: /data/metrics/streaming_metrics.jsonl
  volumes:
    - ivy_cache:/root/.ivy2
    - metrics:/data/metrics
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    minio-init:
      condition: service_completed_successfully

services:
  # ---------- Messaging ----------
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic trips --partitions 3 --replication-factor 1

  # ---------- Object storage (S3 compatible) ----------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 1; done; mc mb --ignore-existing local/lake

  # ---------- Streaming: Kafka -> Bronze -> Silver ----------
  spark-bronze:
    <<: *spark-job
    command: ["python", "-m", "streaming.bronze_job"]

  spark-silver:
    <<: *spark-job
    command: ["python", "-m", "streaming.silver_job"]

  # ---------- Event producer (run on demand: make produce) ----------
  producer:
    build: ./producer
    profiles: ["producer"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    volumes:
      - ./data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ---------- Orchestration ----------
  airflow-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    build: ./airflow
    depends_on:
      airflow-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *aws-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      DBT_DUCKDB_PATH: /data/warehouse/lakehouse.duckdb
      DBT_TARGET_PATH: /tmp/dbt_target
      DBT_LOG_PATH: /tmp/dbt_logs
      ZONES_CSV: /data/raw/taxi_zone_lookup.csv
      S3_ENDPOINT: minio:9000
      S3_ENDPOINT_URL: http://minio:9000
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true) &&
        (airflow scheduler &) &&
        exec airflow webserver
    ports: ["8080:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt_project:/opt/airflow/dbt_project
      - ./quality:/opt/airflow/quality
      - ./maintenance:/opt/airflow/maintenance
      - ./data:/data/raw:ro
      - warehouse:/data/warehouse

  # ---------- Serving ----------
  dashboard:
    build: ./dashboard
    environment:
      <<: *aws-env
      DBT_DUCKDB_PATH: /data/warehouse/lakehouse.duckdb
      METRICS_PATH: /data/metrics/streaming_metrics.jsonl
      S3_ENDPOINT_URL: http://minio:9000
    ports: ["8501:8501"]
    volumes:
      - warehouse:/data/warehouse
      - metrics:/data/metrics

volumes:
  minio_data:
  airflow_pg:
  warehouse:
  metrics:
  ivy_cache:
